name: Build ParikshaSetu Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: 'Publish signed Release APK & version.json to GitHub Releases (only applies to release build)'
        required: false
        default: true
        type: boolean
      release_notes:
        description: 'Optional release notes for version.json & GitHub Release'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Determine Build Mode & App Version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_type }}" = "release" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi
          APP_VERSION=$(grep -E 'versionName\s+"' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          fi
          APP_VERSION_CODE=$(grep -E 'versionCode\s+[0-9]+' android/app/build.gradle | head -n 1 | sed -E 's/.*versionCode\s+([0-9]+).*/\1/')
          if [ -z "$APP_VERSION_CODE" ]; then
            APP_VERSION_CODE="1"
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$APP_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved build mode: $(grep mode= "$GITHUB_OUTPUT" | cut -d= -f2), version: v$APP_VERSION (code $APP_VERSION_CODE)"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Generate Brand & PWA Icon Assets
        run: node scripts/generate-icons.js

      - name: Build Web Application
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}
          VITE_APP_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VITE_BUILD_MODE: ${{ steps.meta.outputs.mode }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        if: steps.meta.outputs.mode == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-output/ParikshaSetu-v${{ steps.meta.outputs.version }}-debug.apk"

      - name: Validate Release Signing Secrets
        if: steps.meta.outputs.mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Actions Secrets for production release signing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi

      - name: Decode Keystore, Build & Sign Release APK
        if: steps.meta.outputs.mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: release.keystore
          APP_VER: ${{ steps.meta.outputs.version }}
          APP_VER_CODE: ${{ steps.meta.outputs.version_code }}
          APK_FILE: ParikshaSetu-v${{ steps.meta.outputs.version }}-release.apk
          DL_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}/ParikshaSetu-v${{ steps.meta.outputs.version }}-release.apk
          REL_NOTES: ${{ inputs.release_notes || format('ParikshaSetu v{0} signed production Android release.', steps.meta.outputs.version) }}
        run: |
          echo "Decoding production keystore into temporary file..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cd android
          ./gradlew assembleRelease
          cd ..
          rm -f android/app/release.keystore
          if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Signed release APK (app-release.apk) was not generated. Verify signing credentials."
            exit 1
          fi
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk "build-output/$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "build-output/$APK_FILE"

          # Generate release version.json manifest using the repository's actual configuration
          export PUB_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          node -e '
            const fs = require("fs");
            const manifest = {
              appId: "com.parikshasetu.app",
              versionName: process.env.APP_VER,
              versionCode: Number(process.env.APP_VER_CODE) || 1,
              apkFileName: process.env.APK_FILE,
              downloadUrl: process.env.DL_URL,
              releaseNotes: process.env.REL_NOTES,
              publishedAt: process.env.PUB_AT
            };
            fs.writeFileSync("build-output/version.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Cleanup Temporary Keystore Files
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f *.keystore *.jks

      - name: Upload APK & Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParikshaSetu-${{ steps.meta.outputs.mode }}-v${{ steps.meta.outputs.version }}
          path: build-output/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish Signed Release APK & Version Manifest to GitHub Releases
        if: steps.meta.outputs.mode == 'release' && inputs.publish_release != false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.meta.outputs.version }}
          APK_PATH: build-output/ParikshaSetu-v${{ steps.meta.outputs.version }}-release.apk
          MANIFEST_PATH: build-output/version.json
          REL_NOTES: ${{ inputs.release_notes || format('ParikshaSetu v{0} signed production Android release.', steps.meta.outputs.version) }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" "$MANIFEST_PATH" --clobber
            gh release edit "$TAG_NAME" --title "ParikshaSetu $TAG_NAME" --notes "$REL_NOTES" --latest
          else
            gh release create "$TAG_NAME" "$APK_PATH" "$MANIFEST_PATH" --title "ParikshaSetu $TAG_NAME" --notes "$REL_NOTES" --latest
          fi

