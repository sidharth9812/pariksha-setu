name: Build ParikshaSetu Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci

      - name: Generate Brand & PWA Icon Assets
        run: node scripts/generate-icons.js

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        if: "${{ github.event.inputs.build_type != 'release' || env.KEYSTORE_BASE64 == '' }}"
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ParikshaSetu-debug.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Sign & Build Release APK (When Secrets Provided)
        if: "${{ github.event.inputs.build_type == 'release' && env.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "Decoding release keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cd android
          ./gradlew assembleRelease
          cd ..
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/ParikshaSetu-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/ParikshaSetu-release-unsigned.apk
          fi
          rm -f android/app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParikshaSetu-Android-APK
          path: build-output/*.apk
          retention-days: 30
          if-no-files-found: error
